apiVersion: v1
kind: Service
metadata:
  name: app-redis
  labels:
    app.kubernetes.io/name: app-redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: app-redis
    app.kubernetes.io/component: cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-redis-data
  labels:
    app.kubernetes.io/name: app-redis
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-redis
  labels:
    app.kubernetes.io/name: app-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  # The data volume is ReadWriteOnce: stop the old pod before starting the
  # new one, or a new pod on another node waits forever to attach it.
  # (Same effect as `type: Recreate` with one replica, but unlike Recreate it
  # applies cleanly over the defaulted strategy of existing Deployments.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-redis
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-redis
        app.kubernetes.io/component: cache
    spec:
      # Redis 8 only fixes data dir ownership when the dir holds nothing but
      # Redis files, and a new volume always has lost+found. Give the redis
      # group (gid 1000 in the image) write access to the volume instead.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: app-redis-data
